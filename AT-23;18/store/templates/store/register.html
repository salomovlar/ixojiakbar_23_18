{% extends 'store/base.html' %}

{% block title %}Ro'yxatdan o'tish{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">Ro'yxatdan o'tish</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger">
                    {{ field.errors }}
                </div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100">Ro'yxatdan o'tish</button>
        </form>
        <p class="mt-3 text-center">
            Hisobingiz bormi? <a href="{% url 'login' %}">Kirish</a>
        </p>
    </div>
</div>
{% endblock %}

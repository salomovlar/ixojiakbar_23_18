{% extends 'store/base.html' %}

{% block title %}Kitobni {{ action }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1 class="mb-4">Kitobni {{ action }}</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger">
                    {{ field.errors }}
                </div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Saqlash</button>
            <a href="{% url 'admin_books' %}" class="btn btn-secondary">Orqaga</a>
        </form>
    </div>
</div>
{% endblock %}

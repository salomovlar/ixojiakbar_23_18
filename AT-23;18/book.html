<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitob - Kichkina Shaxzoda</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            color: white;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        nav {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px 30px;
            margin: 20px auto;
            max-width: 800px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-size: 1.1em;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        nav a:hover, nav a.active {
            background: #667eea;
            color: white;
        }

        .book-detail {
            background: white;
            border-radius: 15px;
            padding: 40px;
            margin: 30px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            align-items: start;
        }

        .book-image img {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .book-info h2 {
            font-size: 2em;
            color: #333;
            margin-bottom: 15px;
        }

        .book-info .author {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 20px;
        }

        .book-meta {
            display: flex;
            gap: 30px;
            margin: 25px 0;
            padding: 20px 0;
            border-top: 2px solid #eee;
            border-bottom: 2px solid #eee;
        }

        .meta-item {
            text-align: center;
        }

        .meta-item .label {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 5px;
        }

        .meta-item .value {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .meta-item .stock {
            color: #28a745;
        }

        .description {
            margin: 25px 0;
            line-height: 1.8;
            color: #555;
            font-size: 1.1em;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .back-btn:hover {
            background: #5568d3;
        }

        .not-found {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 100px 20px;
        }

        @media (max-width: 768px) {
            .book-detail {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Kichkina Shaxzoda</h1>
            <p>Kitob haqida</p>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Bosh sahifa</a></li>
                <li><a href="catalog.html" class="active">Katalog</a></li>
                <li><a href="partners.html">Hamkorlarimiz</a></li>
                <li><a href="about.html">Biz haqimizda</a></li>
            </ul>
        </nav>

        <div id="bookContent"></div>
    </div>

    <script>
        const booksData = [
            {
                "id": "binafsha",
                "title": "Binafsha",
                "author": "Shahlo Qosimova",
                "genre": "roman",
                "price": 45000,
                "stock": 12,
                "image": "https://via.placeholder.com/400x500/667eea/fff?text=Binafsha",
                "description": "Binafsha - zamonaviy o'zbek adabiyotining yorqin namunasi. Kitobda ayol ruhiyati va jamiyatdagi o'rni haqida hikoya qilinadi."
            },
            {
                "id": "shaytanat",
                "title": "Shaytanat",
                "author": "Abdulla Qahhor",
                "genre": "hikoya",
                "price": 55000,
                "stock": 8,
                "image": "https://via.placeholder.com/400x500/764ba2/fff?text=Shaytanat",
                "description": "Abdulla Qahhorning mashhur hikoyalar to'plami. Asarda insoniy fazilatlar va nuqsonlar ustida o'ylashga undaydi."
            },
            {
                "id": "men",
                "title": "Men",
                "author": "O'tkir Hoshimov",
                "genre": "roman",
                "price": 38000,
                "stock": 15,
                "image": "https://via.placeholder.com/400x500/667eea/fff?text=Men",
                "description": "O'tkir Hoshimovning falsafiy roman-bu asar inson va jamiyat o'rtasidagi munosabatlarni ochib beradi."
            },
            {
                "id": "sarob",
                "title": "Sarob",
                "author": "O'tkir Hoshimov",
                "genre": "roman",
                "price": 42000,
                "stock": 10,
                "image": "https://via.placeholder.com/400x500/764ba2/fff?text=Sarob",
                "description": "Hayot va o'lim mavzularida yozilgan chuqur falsafiy asar. Inson izlanishlari haqida."
            },
            {
                "id": "tong-yulduzi",
                "title": "Tong Yulduzi",
                "author": "Erkin Vohidov",
                "genre": "she'r",
                "price": 35000,
                "stock": 20,
                "image": "https://via.placeholder.com/400x500/667eea/fff?text=Tong+Yulduzi",
                "description": "Erkin Vohidov she'riyatining eng yaxshi namunalaridan biri. Vatan, muhabbat va insonparvarlik mavzulari."
            },
            {
                "id": "mantiq",
                "title": "Mantiq",
                "author": "A. Ibn Sino",
                "genre": "ilm",
                "price": 60000,
                "stock": 5,
                "image": "https://via.placeholder.com/400x500/764ba2/fff?text=Mantiq",
                "description": "Ibn Sinoning falsafiy asari. Mantiq fanining asoslari va inson tafakkuri haqida."
            }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('id');
        const book = booksData.find(b => b.id === bookId);
        const container = document.getElementById('bookContent');

        if (!book) {
            container.innerHTML = '<div class="not-found">Kitob topilmadi</div>';
        } else {
            document.title = `${book.title} - Kichkina Shaxzoda`;
            container.innerHTML = `
                <div class="book-detail">
                    <div class="book-image">
                        <img src="${book.image}" alt="${book.title}">
                    </div>
                    <div class="book-info">
                        <h2>${book.title}</h2>
                        <p class="author">${book.author}</p>
                        <div class="book-meta">
                            <div class="meta-item">
                                <div class="label">Narxi</div>
                                <div class="value">${book.price.toLocaleString()} so'm</div>
                            </div>
                            <div class="meta-item">
                                <div class="label">Mavjud</div>
                                <div class="value stock">${book.stock} dona</div>
                            </div>
                            <div class="meta-item">
                                <div class="label">Janr</div>
                                <div class="value">${book.genre}</div>
                            </div>
                        </div>
                        <div class="description">
                            ${book.description}
                        </div>
                        <a href="catalog.html" class="back-btn">← Katalogga qaytish</a>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
